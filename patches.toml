# What goes into Zeron nightly, applied in this order on top of upstream.
#
# Each [[patch]] is one of:
#   pr = N, sha = "..."   an upstream pull request, merged at the pinned commit.
#                         Pinning means a later push to the PR cannot reach your
#                         machine until you review it and move the pin.
#   file = "patches/..."  a patch in this repo, applied with `git am -3`.
#   branch = "name"       a branch of this repo, merged at its tip.
#
# `enabled = false` keeps an entry without applying it. A patch that no longer
# applies is dropped from that night's build and listed in the release notes;
# the rest of the build goes on without it.

[upstream]
repo = "zeronsh/zeron"
branch = "main"

[nightly]
repo = "hoangvu12/zeron-nightly"

[[patch]]
name = "windows-prerelease-versions"
file = "patches/0001-windows-prerelease-versions.patch"
note = "Lets the Windows updater and packaging take 0.2.137-nightly.N versions. Needed by every nightly."

[[patch]]
name = "large-plain-folder-index"
pr = 1196
sha = "44d08d24675660638e957b0ef42c638188e70bce"
note = "Walk-based index for large plain folders, kept current with a watch. Stacked on #1184."

[[patch]]
name = "dead-run-shimmer"
pr = 840
sha = "febdceb6e950f123f5cbc5f78d3a031d4a70a919"
note = "Stops the tool-group shimmer on dead runs, which kept repainting at 30 fps. Closed upstream (v3 replaces crates/ui), so it stays here for as long as v2 does."

[[patch]]
name = "flaky-test-fixes"
pr = 869
sha = "b9f2c4b89f526f9d7d64d0e2a7496da99cc84c31"
note = "Retries queue inserts and the Windows composer-defaults read; fixes flaky tests. Closed upstream, which would take it rebased on main."

[[patch]]
name = "composer-click-through"
pr = 1191
sha = "92ea6927e59bffc5df0017b64da949bc4833e11d"
note = "Clicks in the composer no longer open images underneath it. Closed upstream (v3 replaces crates/ui), so it stays here for as long as v2 does."

[[patch]]
name = "windows-icon"
pr = 1084
sha = "a0476792700411ba0e9362646223ae0a979a0dc8"
enabled = false
note = "Windows app icon without the macOS rounded-square look. Parked: upstream's new app icon (cd0ec07d) replaced the one this reworks, so it would bring the old one back."

[[patch]]
name = "warm-chats-parked-cap"
pr = 1101
sha = "d17965e8273b473f59114e2620a3a98a6ca9f648"
note = "Keeps the 3 most recently focused chats' CLIs warm and stops older idle ones after 5 min (ZERON_PARKED_SESSION_CAP=0 disables); reuses laid-out transcripts on chat switch; model catalogs stay fresh for 10 min. Its conflict with main's parked waits in sessions.rs replays from rerere/, which also keeps the cap off a chat waiting for its wake turn."

[[patch]]
name = "markdown-reply-images"
file = "patches/0002-markdown-reply-images.patch"
note = "Markdown images in replies (`![alt](path)`) show from any local folder on the chat's host (network and device paths still refused), and the host keeps a copy when the reply finishes so they outlive their files. Relative paths work in scratch chats; agents are told to use Markdown instead of show_image. Desktop only; not upstream."

[[patch]]
name = "relay-image-reads"
file = "patches/0003-relay-image-reads.patch"
note = "Images from a chat on another device load in a few relay round trips instead of one per 45 KB chunk: the host reports the file's size and the app asks for 8 chunks at a time, retrying a chunk the relay drops. Works against older hosts too (without the size). Nothing changes on the relay. Desktop only; not upstream. Applies on top of markdown-reply-images."

# Open upstream PRs that conflict with main today. Enable one once it is
# rebased (or after recording a resolution, see README).
[[patch]]
name = "slash-command-latency"
pr = 927
sha = ""
enabled = false
note = "Kill discovery probes, cache command catalogs. Conflicts with main (registry.rs, the claude and codex harnesses)."
