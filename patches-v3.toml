# What goes into Zeron v3 nightly: the zgx interface (apps/zgx) on top of
# upstream's main (.github/workflows/nightly-v3.yml).
#
# Upstream merged its zeron/zgx branch into main (0.3.0, 2026-11-12) and
# ships the zgx app from main since; zeron/zgx is frozen at c1539061b. The
# v2 interface (crates/ui) is no longer built: this is the only list.

[upstream]
repo = "zeronsh/zeron"
branch = "main"

[nightly]
repo = "hoangvu12/zeron-nightly"
# The version's prerelease: <next patch release>-v3.YYYYMMDDHHMM.
label = "v3"

[[patch]]
name = "windows-prerelease-versions"
file = "patches/0001-windows-prerelease-versions-zgx.patch"
required = true
note = "The updater part of 0001, for the zgx line (zeron/zgx, now main): the Windows updater takes prerelease versions (0.3.8-v3.N), not only a beta's. v3 packages with its own script and installer, so it needs no packaging part."

[[patch]]
name = "v3-windows-install-layout"
file = "patches/0004-v3-windows-install-layout.patch"
required = true
note = "v3 on Windows opens no console window and reads its ui folder beside zeron.exe. Needed by every v3 nightly."

[[patch]]
name = "v3-windows-installer-updates"
file = "patches/0005-v3-windows-installer-updates.patch"
required = true
note = "v3 updates itself on Windows: it downloads the release's installer and runs it silently over its folder, then restarts its engine into the new one once idle. Needed by every v3 nightly."

[[patch]]
name = "large-plain-folder-index"
pr = 1196
sha = "82a0a07bbe01b51521340a97c7e656741c0953c1"
note = "Walk-based index for large plain folders, kept current with a watch; disk roots refused. Stacked on #1184."

[[patch]]
name = "warm-chats-parked-cap"
pr = 1101
enabled = false
sha = "d17965e8273b473f59114e2620a3a98a6ca9f648"
note = "Keeps the 3 most recently focused chats' CLIs warm and stops older idle ones after 5 min. Off since 2026-11-11: it conflicts with zeron/zgx's background waits in sessions.rs, which main has too (rerere/ no longer replays it); turn it back on once re-resolved."

[[patch]]
name = "markdown-reply-images"
file = "patches/0002-markdown-reply-images.patch"
note = "Markdown images in replies from any local folder, kept when the reply finishes. The engine part serves v3 too."

[[patch]]
name = "relay-image-reads"
file = "patches/0003-relay-image-reads.patch"
note = "Images from a chat on another device load in a few relay round trips. Applies on top of markdown-reply-images."

[[patch]]
name = "agent-steers-wait-for-tools"
file = "patches/0008-agent-steers-wait-for-tools.patch"
note = "An agent's send_message to a busy chat no longer stops the command that chat is running (the agent there read the stop as its call declined, and waited for nobody): it goes by the mailbox (Steer at_once false) and lands at the next step. The person's own steers are still read at once, and a steer that stops a command now tells the agent it was stopped, not declined. Rebased onto main, which has upstream's own fix for the same bug (d071ed2db: a steer with the from-another-chat header never stops a command). This patch replaces that guard in steer_now with its own at_once flag, so an agent's explicit mode 'steer' still stops the command (with the note), as child-chats-report-back's tests expect; upstream's test sends at_once false, as an agent's ordinary send does. A steer from a peer without this patch (a Cloud machine on upstream Zeron) has no at_once and is read at once, as before d071ed2db."

[[patch]]
name = "child-chats-report-back"
file = "patches/0007-child-chats-report-back.patch"
note = "Subagents and side chats report back to the chat that made them when their turn ends, a few seconds apart at most, never waiting on a stuck sibling. Kept in the chats themselves, so restarts and other devices lose none. A steer's stop is no stop, and a stop's report never takes the place of the end's. Goes after agent-steers-wait-for-tools, which its tests need. Regenerated onto main 09766b39 (0.3.7, Auto's reviewer): ds/activity.luau keeps main's Tooltip require beside its SubagentRow, and its tool_line/row split."

[[patch]]
name = "child-reports-follow-ups"
file = "patches/0009-child-reports-follow-ups.patch"
note = "What real use of child-chats-report-back found: a turn a child starts on its own (its tests done, a timer) reports as a follow-up; a reply repeating what the child sent isn't said twice; a child's answer to a thanks doesn't wake its parent; the still-working note is short and right across devices; a report after the person's Stop still wakes the parent; after a handoff the new orchestrator gets the children, and nobody writes to an archived chat; a restart or another chat's Stop isn't the person's; a turn that ended on an error reports failed; Pi's info toasts stay out of replies, and Pi without a Zeron account still counts as connected. Applies on top of child-chats-report-back."

[[patch]]
name = "child-reports-held-stop"
file = "patches/0010-child-reports-held-stop.patch"
note = "The person's Stop on a child is held for two minutes: what they write to it meanwhile corrects the parent's task, so the parent hears nothing until the child's normal finished report, and the child stays on its wait. A Stop left standing reports once the hold is out; an agent's Stop or a Zeron restart still reports at once. Once the person writes to a child otherwise, it is theirs and its ends no longer report. Applies on top of child-reports-follow-ups."

[[patch]]
name = "reply-long-page-picture"
file = "patches/0011-reply-long-page-picture.patch"
note = "A long page in a reply (a phone screenshot, taller than 2:1) shows its top across its frame at its own shape, not blown up with its middle cropped: its `ui.image` took its pixels' own height as a flex item, and `cover` filled that. Not yet a PR upstream."

# The Design plugin's plugin-API PR (pure-Luau Design plugin, developed
# against this nightly until upstream merges it).

[[patch]]
name = "design-plugin-apis"
file = "patches/0018-design-plugin-apis.patch"
note = "#1392 at 6094319cb as one file, merged onto main: the Design plugin's plugin APIs (#1362 tool images, #1363 service memory, #1366 zeron.eval, #1367 measure_text/load_font in services, #1378 fonts, #1379 fetch bytes in base64, #1380 a service's zeron.db, #1398 zeron.write_file and files.write, and a plugin window's memory from its manifest, which was 0013). #1392's base is still the frozen zeron/zgx, and main moved the same Cargo.toml lines (its zgx pin) and the consent fixture, so a `pr` entry conflicts. Its zgx is hoangvu12/zgx ebebffb01, kept on branch nightly-design-ebebffb0 so a force-push of a PR can't take it away: #2110 at 4914d045a (on zgx main 126357bb5) with #2299's tile fixes cherry-picked on (they sat on #2110's earlier head a37e02b67) and #2285 (middle-mouse press), #2297 (full screen) and #2298 (display scale) merged; main pins zeronsh/zgx d391ea72, which it contains. Before that it was 24b35872 (nightly-design-24b35872). It carries everything 0012's nightly-design-export (1890c055) did, so that patch is gone. The consent fixture lists both main's draft and #1392's fonts; both lockfiles are regenerated."
# When #1392 moves: in a checkout assembled up to here minus this entry, merge
# the new head, take main's side of apps/zgx/Cargo.toml with each zgx rev
# moved to #1392's (and the comment above `zgx =`), union the consent
# fixture's permission lists, take main's apps/zgx/Cargo.lock and let
# `cargo metadata` (root and apps/zgx) update both locks, check both with
# `cargo metadata --locked`, then regenerate this file as one commit with
# `git format-patch --full-index`. Keep a new zgx rev on a branch of its own
# on hoangvu12/zgx (never a force-pushed one), as nightly-design-24b35872 is.
# Once #1392 is retargeted to main upstream, make this a `pr` entry again.

[[patch]]
name = "plugin-windows"
pr = 1485
sha = "6a48aacda3164f3bdcd2f388e4ff9a9fd0c04df5"
note = "A plugin's declared `ui.window`s open in the zgx app (zgx_run::follow_windows, as zgx-run does), so the Design plugin's windows (and #2297's full screen, #2298's scale in them) show. One file, apps/zgx/src/main.rs; on main. Goes after design-plugin-apis, the plugin APIs it serves."

[[patch]]
name = "agent-device-commands"
pr = 1458
sha = "a4e90bbf0ffa842425831d151abdd6e2b1e92ad6"
note = "Agents run shell commands on any online device (Zeron MCP's run_command, command_output, stop_command, list_commands), with background ones in the chat's background band; Cloud chats reach every device (the edge part only takes effect once upstream deploys it). A `pr` entry now that the base is main (#1458 is on main f6a9bbfc): the PR as written, with main's terminal picker and plugin-preview list, not the zgx-adapted file it was (0014-agent-device-commands). Both devices need this build: the command runs on the target's engine. The child-reports patches below go after it."

[[patch]]
name = "child-reports-one-rule"
file = "patches/0014-child-reports-one-rule.patch"
note = "Child reports follow one rule: the first turn of a child after its parent's message answers it, whoever wrote in between; the person's Stop is filed quietly, an agent's Stop still reports. A question's report names its request_id and drops once that exact question is answered; reports from children on other devices are kept until they rest. A subagent created on a host that won't report back says so at creation. Goes after agent-device-commands (#1458); needs child-reports-held-stop."

[[patch]]
name = "child-reports-holds-and-groups"
file = "patches/0015-child-reports-holds-and-groups.patch"
note = "Child reports wake the parent less, and only with something new: a progress message can wait for its child's end (FYIs never wake alone); a report the parent's agent already read with read_chat isn't said again; a child that keeps coming back is paused after 20 reports until the person writes; while the person talks to the parent, its children's reports go with their next message (or after 5 quiet minutes); and create_chats notify:\"all\" hears from a group of children once, when all are done (30-minute fallback). Held reports are kept in the chat, and reports a restart caught after they reached the transcript but before the agent read them go again; one caught between the queue and the transcript is still lost, as any queued message is (a core queue follow-up). Applies on top of child-reports-one-rule."

[[patch]]
name = "child-reports-watch"
file = "patches/0016-child-reports-watch.patch"
note = "The parent's device reports for a child whose device doesn't (an older Zeron, like Linux SG before this), or that updated after its turn and has been back online two minutes without reporting: once the child's chat, synced here, shows the very turn its registry row names, by the same rule and keys its own host would use, re-checked as the report is built. If the reply hasn't synced 10 minutes on and the outcome is this request's, the parent hears its status alone and the full report follows. A turn a shutdown cut is left for its host to revive. The parent's notes say when a child's device is offline or its status unconfirmed, and a subagent created on such a device is said to be reported for by the parent's watcher. Applies on top of child-reports-holds-and-groups."

[[patch]]
name = "child-reports-run-command"
file = "patches/0017-child-reports-run-command.patch"
note = "A command a child left running with run_command (agent-device-commands, #1458) never wakes it, so it no longer holds back the follow-up its runtime's own background work wakes it for. An end with only such commands lists them and lets no follow-up through, the parent's note no longer lists that child as still working for it, and a thanks answered under one stays quiet. Applies on top of child-reports-watch."

