# What goes into Zeron v3 nightly: the zgx interface (apps/zgx) on top of
# upstream's zeron/zgx branch, built and released apart from the v2 nightly
# (.github/workflows/nightly-v3.yml). Same format as patches.toml.
#
# Most entries are engine fixes from patches.toml: v3 runs the engine built
# from this same tree. Keep them in step with patches.toml by hand, except
# for PRs merged into main that zeron/zgx has yet to take.

[upstream]
repo = "zeronsh/zeron"
branch = "zeron/zgx"

[nightly]
repo = "hoangvu12/zeron-nightly"
# The version's prerelease: <next patch release>-v3.YYYYMMDDHHMM.
label = "v3"

[[patch]]
name = "windows-prerelease-versions"
file = "patches/0001-windows-prerelease-versions.patch"
note = "Lets the Windows updater and packaging take prerelease versions."

[[patch]]
name = "v3-windows-install-layout"
file = "patches/0004-v3-windows-install-layout.patch"
note = "v3 on Windows opens no console window and reads its ui folder beside zeron.exe. Needed by every v3 nightly."

[[patch]]
name = "v3-windows-installer-updates"
file = "patches/0005-v3-windows-installer-updates.patch"
note = "v3 updates itself on Windows: it downloads the release's installer and runs it silently over its folder, then restarts its engine into the new one once idle. Needed by every v3 nightly."

[[patch]]
name = "large-plain-folder-index"
pr = 1196
sha = "82a0a07bbe01b51521340a97c7e656741c0953c1"
note = "Walk-based index for large plain folders, kept current with a watch; disk roots refused. Stacked on #1184."

[[patch]]
name = "dead-run-shimmer"
pr = 840
sha = "febdceb6e950f123f5cbc5f78d3a031d4a70a919"
note = "Stops the tool-group shimmer on dead runs. v2 interface only; kept so the engine matches v2's. Closed upstream (v3 replaces crates/ui)."

[[patch]]
name = "flaky-test-fixes"
pr = 869
sha = "b9f2c4b89f526f9d7d64d0e2a7496da99cc84c31"
note = "Retries queue inserts and the Windows composer-defaults read; fixes flaky tests. Closed upstream, which would take it rebased on main."

[[patch]]
name = "composer-click-through"
pr = 1191
sha = "92ea6927e59bffc5df0017b64da949bc4833e11d"
note = "Clicks in the composer no longer open images underneath it. v2 interface only. Closed upstream (v3 replaces crates/ui)."

[[patch]]
name = "warm-chats-parked-cap"
pr = 1101
sha = "d17965e8273b473f59114e2620a3a98a6ca9f648"
note = "Keeps the 3 most recently focused chats' CLIs warm and stops older idle ones after 5 min. Its sessions.rs conflict replays from rerere/."

[[patch]]
name = "change-request-spawn-off-runtime"
pr = 1224
sha = "0ef067a5167540732c7edc7af780546ae9ad0ed0"
note = "PR watches start Git off the runtime workers, so slow Windows process launches stop freezing the engine. Merged into main (1dc5a8cc), not yet in zeron/zgx: drop it once zeron/zgx has it (patches.toml already did)."

[[patch]]
name = "revived-turn-zeron-tools"
pr = 1285
sha = "0b2674d93839f081e9a41c95dc59987a12cee080"
note = "A turn the engine resumes after a crash keeps its Zeron tools (send_message, create_chat, wait_for_turn): it waits for the engine's port before it starts. child-chats-report-back is rebased on this pin: move them together."

[[patch]]
name = "markdown-reply-images"
file = "patches/0002-markdown-reply-images.patch"
note = "Markdown images in replies from any local folder, kept when the reply finishes. The engine part serves v3 too."

[[patch]]
name = "relay-image-reads"
file = "patches/0003-relay-image-reads.patch"
note = "Images from a chat on another device load in a few relay round trips. Applies on top of markdown-reply-images."

[[patch]]
name = "agent-steers-wait-for-tools"
file = "patches/0008-agent-steers-wait-for-tools.patch"
note = "An agent's send_message to a busy chat no longer stops the command that chat is running (the agent there read the stop as its call declined, and waited for nobody): it lands at the next step. mode 'steer' and the person's own steers are still read at once, and a steer that stops a command now tells the agent it was stopped, not declined. v3 only: it conflicts with main's plugin_agents.rs."

[[patch]]
name = "child-chats-report-back"
file = "patches/0007-child-chats-report-back.patch"
note = "Subagents and side chats report back to the chat that made them when their turn ends, a few seconds apart at most, never waiting on a stuck sibling. Kept in the chats themselves, so restarts and other devices lose none. A steer's stop is no stop, and a stop's report never takes the place of the end's. Applies on top of revived-turn-zeron-tools at its pin; goes after agent-steers-wait-for-tools, which its tests need."

# Not on v3: windows-icon (#1084, parked in patches.toml). zeron/zgx has its
# own new app icon, which it conflicts with.
