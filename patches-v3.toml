# What goes into Zeron v3 nightly: the zgx interface (apps/zgx) on top of
# upstream's zeron/zgx branch, built and released apart from the v2 nightly
# (.github/workflows/nightly-v3.yml). Same format as patches.toml.
#
# Most entries are engine fixes from patches.toml: v3 runs the engine built
# from this same tree. Keep them in step with patches.toml by hand.

[upstream]
repo = "zeronsh/zeron"
branch = "zeron/zgx"

[nightly]
repo = "hoangvu12/zeron-nightly"
# The version's prerelease: 0.2.137-v3.YYYYMMDDHHMM.
label = "v3"

[[patch]]
name = "windows-prerelease-versions"
file = "patches/0001-windows-prerelease-versions.patch"
note = "Lets the Windows updater and packaging take prerelease versions."

[[patch]]
name = "v3-windows-install-layout"
file = "patches/0004-v3-windows-install-layout.patch"
note = "v3 on Windows opens no console window and reads its ui folder beside zeron.exe. Needed by every v3 nightly."

[[patch]]
name = "v3-windows-installer-updates"
file = "patches/0005-v3-windows-installer-updates.patch"
note = "v3 updates itself on Windows: it downloads the release's installer and runs it silently over its folder, then restarts its engine into the new one once idle. Needed by every v3 nightly."

[[patch]]
name = "v3-windows-polish"
pr = 1225
sha = "3933c4cbe6bbd3edff89931e59551ecc89169e07"
note = "v3 on Windows looks like the shipping app: frosted surfaces, caption buttons. Also no console windows, the exe icon, pictures from Windows devices, the model picker on any device and the page card. Merged with zeron/zgx, so it takes that pin of zgx; v3-zgx-windows-fixes adds the zgx side."

[[patch]]
name = "v3-zgx-windows-fixes"
file = "patches/0006-v3-zgx-windows-fixes.patch"
note = "Points v3's zgx at hoangvu12/zgx nightly/v3-zgx: zeron/zgx's pin plus zeronsh/zgx#1495 (Windows glass blur), #1496 (caption colours), the cursor fix under pointer_events none, #1500 (popup cursor, GetDC leak), #1516 (text below 2x), #1531 (fast drags paint) and #1539 (input method quit). Applies on top of v3-windows-polish. Drop it once zeron/zgx pins a zgx with all of them."

[[patch]]
name = "large-plain-folder-index"
pr = 1196
sha = "44d08d24675660638e957b0ef42c638188e70bce"
note = "Walk-based index for large plain folders, kept current with a watch. Stacked on #1184."

[[patch]]
name = "dead-run-shimmer"
pr = 840
sha = "febdceb6e950f123f5cbc5f78d3a031d4a70a919"
note = "Stops the tool-group shimmer on dead runs. v2 interface only; kept so the engine matches v2's."

[[patch]]
name = "flaky-test-fixes"
pr = 869
sha = "b9f2c4b89f526f9d7d64d0e2a7496da99cc84c31"
note = "Retries queue inserts and the Windows composer-defaults read; fixes flaky tests."

[[patch]]
name = "composer-click-through"
pr = 1191
sha = "92ea6927e59bffc5df0017b64da949bc4833e11d"
note = "Clicks in the composer no longer open images underneath it. v2 interface only."

[[patch]]
name = "warm-chats-parked-cap"
pr = 1101
sha = "d17965e8273b473f59114e2620a3a98a6ca9f648"
note = "Keeps the 3 most recently focused chats' CLIs warm and stops older idle ones after 5 min. Its sessions.rs conflict replays from rerere/."

[[patch]]
name = "change-request-spawn-off-runtime"
pr = 1224
sha = "0ef067a5167540732c7edc7af780546ae9ad0ed0"
note = "PR watches start Git off the runtime workers, so slow Windows process launches stop freezing the engine."

[[patch]]
name = "markdown-reply-images"
file = "patches/0002-markdown-reply-images.patch"
note = "Markdown images in replies from any local folder, kept when the reply finishes. The engine part serves v3 too."

[[patch]]
name = "relay-image-reads"
file = "patches/0003-relay-image-reads.patch"
note = "Images from a chat on another device load in a few relay round trips. Applies on top of markdown-reply-images."

[[patch]]
name = "child-chats-report-back"
file = "patches/0007-child-chats-report-back.patch"
note = "Subagents and side chats report back to the chat that made them when their turn ends, a few seconds apart at most, never waiting on a stuck sibling. Kept in the chats themselves, so restarts and other devices lose none. Applies on top of relay-image-reads."

# Not on v3: zeron/zgx has its own new app icon.
[[patch]]
name = "windows-icon"
pr = 1084
sha = "a0476792700411ba0e9362646223ae0a979a0dc8"
enabled = false
note = "zeron/zgx carries its own new icon, which this conflicts with."
