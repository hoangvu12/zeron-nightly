# Old peers and Auto (4b983c6c8).

[[patch]]
name = "auto-mode-old-peers"
file = "patches/0020-auto-mode-old-peers.patch"
note = "Devices on engines from before upstream's Auto access mode (4b983c6c8; 0.3.7, and nightlies before it) failed every ListHarnesses against a device listing Auto (unknown variant `auto`), so they couldn't create or message chats there; a chat or run in Auto broke them the same way. \"auto\" no longer goes where they read (zeron_proto::access_wire): the catalog's accessModes lists only the modes they know, with autoAccessMode beside it, and a chat's or a run's access holds supervised (the stricter mode every agent with modes honors) with autoAccess beside it. This build reads Auto back, and still reads a plain \"auto\". The agent gate and zgx, which handle these as raw JSON, go through the same helpers. Regenerated onto main 2e72f94e6: zgx's run request is main's run_request (which its warm start uses too), so access_wire writes it there."

[[patch]]
name = "docker-sign-in"
file = "patches/0021-docker-sign-in.patch"
enabled = false
note = "Docker Sandbox's \"Sign in with Docker\" waited forever after the code was approved (the Laptop, 2026-11-17): the registry still named as Docker's host device one the account no longer had, so the key went there, wasn't taken, and was forgotten, which was only logged. A named host device that isn't among the account's devices is now none (once the device list has loaded). The background sign-in's end is listed with the provider (ListSandboxProviders `connect {userCode, error?}`), and Settings › Sandboxes shows a refused sign-in, a key the host device didn't take, or an expired code (its own timeout too) with Try again. Applies on top of docker-sandbox."

[[patch]]
name = "docker-place-shows-sandbox"
file = "patches/0022-docker-place-shows-sandbox.patch"
enabled = false
note = "A chat on Docker Sandbox (zeron-dev) sat on \"Sending…\" under \"Unknown device\" with no step line (the Laptop, 2026-11-17), then failed unseen: Docker can't create from zeron-dev (its own operation times out, nothing made; other templates take seconds), so Create failed after 240 s. Until a sandbox's engine signs in its device had no row, so devices called it unknown and the composer never followed its steps. The host device now gives a placed chat's sandbox device a row at once (`sandbox:<provider>`, never online, never a host device): every device shows \"Docker Sandbox\", and the step line shows Creating sandbox, then the failure with Run again. Also: a Blank picked while the template list loads is no longer replaced by the first template. Applies on top of docker-sign-in."

[[patch]]
name = "docker-sandbox-own-engine"
file = "patches/0024-docker-sandbox-own-engine.patch"
enabled = false
note = "A chat on Docker Sandbox (zeron-build, the Laptop, 2026-11-18) failed at Starting Zeron with \"zeron-engine has no window: open the Zeron app\": the nightly isn't a release build, so Install Zeron took the edge's latest (upstream's 0.3.8), which has no `watchdog` (docker-sandbox's) and stopped. A build that sets ZERON_SANDBOX_ENGINE_RELEASES at build time (the nightly: its release's download folder, scripts/package-v3-windows.ps1 -SandboxEngineReleases) installs its own Linux engine from there and nowhere else (the `linux` job builds the release's Linux tarballs, upstream's scripts/package-linux.sh, and publish attaches them), fails saying so when it's missing, keeps a template's engine only when it is that build, and checks the one it installed. Upstream's builds don't set it: no change there. Whether a release has a file is asked with a 1-byte GET, not a HEAD: in a Docker sandbox the proxy signs github.com's requests and GitHub's release storage answers a HEAD with 401 (0.3.9-v3.202611180811's sandboxes said it had no Linux engine). One file and its Docker smoke, crates/engine/src/sandboxes.rs. Applies on top of docker-sandbox."

[[patch]]
name = "docker-sandbox-run-again-starts"
file = "patches/0025-docker-sandbox-run-again-starts.patch"
enabled = false
note = "Run again after a failed Install Zeron (the Laptop, 2026-11-18) failed with \"The sandbox isn't running (it's stopped)\": the sandbox had stopped at Docker's time limit while the failure waited, and Run again reran only the failed step on. It now reruns Start too when Start had started the sandbox (starting a running one does nothing); a provider that skipped Start keeps it skipped. One file, crates/engine/src/sandboxes/steps.rs. Applies on top of docker-sandbox."

[[patch]]
name = "sandbox-templates-refresh"
file = "patches/0027-sandbox-templates-refresh.patch"
enabled = false
note = "The place's Template row kept listing the templates the account had when Docker Sandbox was first picked (the PC, 2026-11-18): zgx-dev-claude and zeron-dev-claude, saved since, didn't show, and zgx-dev and zeron-dev, removed, did, until Zeron restarted. The list was asked for once per provider and reused. Each opening of the row (hover, click, or the place's pick) now asks again; the list shown stays until the new one comes, one that fails leaves it, and a pick the account no longer has goes to the default. apps/zgx/ui only: screens/chat/where.luau (`refresh_templates`), ds/composer.luau (`on_templates_open`), screens/chat/composer.luau, and ui/tests/chat_where_sandbox.test.luau with its fixture. Applies on top of docker-place-shows-sandbox."

[[patch]]
name = "mcp-create-chat-on-place"
file = "patches/0028-mcp-create-chat-on-place.patch"
enabled = false
note = "An agent couldn't put a chat on Docker Sandbox: MCP's create_chat knew devices, projects and Cloud only. create_chat and create_chats take `place` (a sandbox provider, by id or name) and `template` (by id or exact name, asked of the account each time; none or `blank` is Blank) and send createChat with `place` as the composer does (deviceId only without a project). Harness and model are checked against the template's catalog (`place:<provider>:<template>`): an agent the template hasn't got is refused naming what it has, Blank with no agent is refused, an unknown template lists the account's. The sandbox's device and checkout come back from the engine; the reply's `place` says the sandbox is still being made (a first prompt and its wait include that). Not with device, cloud, cwd or branch. crates/mcp/src/tools.rs and zeron.rs; no engine change. Applies on top of docker-sandbox."

# Boot time.

[[patch]]
name = "fast-boot-journal-scan"
file = "patches/0023-fast-boot-journal-scan.patch"
note = "The engine took 35-49 s to be ready on the PC (2026-11-14 to 11-18), all of it boot's crash scan (RunJournal::stale_sessions) opening every journal ever written (1,133, 1.1 GB) to read its tail: Windows Defender reads a whole file before its first open returns, ~28 ms a journal with a cold scan cache (after a reboot or a signature update). closed-journals.idx, beside the journals, keeps each journal last seen ending in a closed turn with its size and modified time; boot reads only metadata (no scan) and opens only new or changed journals, 8 at a time. Journals are append-only, so a stale line can't hide a crash; losing the index costs one slower boot. On a copy of the PC's profile, cold cache: 34.6 s before, 1.5 s after, ~11 s once to build the index. One file, crates/engine/src/run_journal.rs; upstream's main since fb09b2391 doesn't touch it. Not yet a PR upstream."

# Install safety.

[[patch]]
name = "ui-without-app-refused"
file = "patches/0026-ui-without-app-refused.patch"
note = "The PC's v3 opened on nothing (2026-11-18): an update's installer stopped partway after deleting the install's ui folder (dist/zeron-v3.iss now swaps it in only once copied), and the next launch copied the missing folder into templates\\.zeron as an empty one, taking .live's app.luau with it, with the error on stderr alone. sync_zeron now refuses a ui/ without its app.luau and keeps .zeron as the last copy laid it; a launch with ui/ unusable runs .live as the last launch laid it; the errors reach zeron-headed.log. apps/zgx/src/plugins/live.rs and mod.rs, and tracing in apps/zgx's Cargo.toml. Upstream's bug too (its installs swap whole, so it rarely shows there): not yet a PR upstream."

# The composer.

[[patch]]
name = "slash-list-stuck-loading"
file = "patches/0029-slash-list-stuck-loading.patch"
note = "The `/` list stayed on its loading rows after Zeron was closed and opened again, until Reload Zeron (Discord, 2026-11-23): the engine starts cold with the app, a read of the agent's commands that never answered left its list loading, and a list loading was never asked for again. The host's call (chat.invocations) has no deadline, and the engine can wait without one (execution_lease while an agent's update is pending). A read now has 30 s: then it's asked once more, then the list fails and the next `/` or `$` reads again; a late answer to a read given up on changes nothing. apps/zgx/ui only: screens/chat/invocations.luau, with chat_fixture.luau's `invocations_hang` and two tests in tests/chat_invocations.test.luau. What makes the first read hang on a cold engine isn't known yet. Upstream's bug too: not yet a PR upstream."

[[patch]]
name = "failed-sends-discard"
file = "patches/0031-failed-sends-discard.patch"
note = "A send not delivered could only be sent again, and one that failed before its run was made (a file's upload, the link to its device down, a new chat not yet known here) was dropped by its send again, words and all: a new chat's composer had already let them go (Discord, 2026-11-24, and a new chat on the Laptop sent while the link to it dropped). Rows that kept failing (a file over the 24 MB cap) sat under every later turn until a restart. A pending prompt now keeps its send's request and is sent again whole from it, its row staying; the row says why when known (\"A file is over 24 MB\") and offers Discard (chat.discard: the row goes, unsent; one held in the engine's outbox is taken out first by RemoveHeldSend). apps/zgx only: src/chat.rs (Pending's request, failure and outbox item; retry; discard), src/plugins/preview.rs (refused in preview), ds/transcript.luau's failed line, screens/chat session, lane_tab and store, Zeron v2's lane_tab copy and .base.json (its lane_tab hash alone: ds/sidebar.luau's drift is upstream's), locales; two Rust tests in chat_pending_tests.rs, two UI tests in chat_in_place.test.luau. Upstream's bug too: not yet a PR upstream."
