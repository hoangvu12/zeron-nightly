# What goes into Zeron v3 nightly: the zgx interface (apps/zgx) on top of
# upstream's zeron/zgx branch (.github/workflows/nightly-v3.yml).
#
# v2 (upstream main and crates/ui) is no longer built: this is the only list.
# A PR merged into main stays applied at its pin until zeron/zgx takes it.

[upstream]
repo = "zeronsh/zeron"
branch = "zeron/zgx"

[nightly]
repo = "hoangvu12/zeron-nightly"
# The version's prerelease: <next patch release>-v3.YYYYMMDDHHMM.
label = "v3"

[[patch]]
name = "windows-prerelease-versions"
file = "patches/0001-windows-prerelease-versions-zgx.patch"
required = true
note = "The updater part of 0001, for zeron/zgx: the Windows updater takes prerelease versions (0.2.137-v3.N), not only a beta's. zeron/zgx rewrote the lines 0001 changes (valid_version, package-windows.ps1, zeron.iss), so one file can't apply on both lists; v3 packages with its own script and installer, so it needs no packaging part."

[[patch]]
name = "v3-windows-install-layout"
file = "patches/0004-v3-windows-install-layout.patch"
required = true
note = "v3 on Windows opens no console window and reads its ui folder beside zeron.exe. Needed by every v3 nightly."

[[patch]]
name = "v3-windows-installer-updates"
file = "patches/0005-v3-windows-installer-updates.patch"
required = true
note = "v3 updates itself on Windows: it downloads the release's installer and runs it silently over its folder, then restarts its engine into the new one once idle. Needed by every v3 nightly."

[[patch]]
name = "large-plain-folder-index"
pr = 1196
sha = "82a0a07bbe01b51521340a97c7e656741c0953c1"
note = "Walk-based index for large plain folders, kept current with a watch; disk roots refused. Stacked on #1184."

[[patch]]
name = "warm-chats-parked-cap"
pr = 1101
enabled = false
sha = "d17965e8273b473f59114e2620a3a98a6ca9f648"
note = "Keeps the 3 most recently focused chats' CLIs warm and stops older idle ones after 5 min. Off since 2026-11-11: it conflicts with zeron/zgx's background waits in sessions.rs (rerere/ no longer replays it); turn it back on once re-resolved."

[[patch]]
name = "markdown-reply-images"
file = "patches/0002-markdown-reply-images.patch"
note = "Markdown images in replies from any local folder, kept when the reply finishes. The engine part serves v3 too."

[[patch]]
name = "relay-image-reads"
file = "patches/0003-relay-image-reads.patch"
note = "Images from a chat on another device load in a few relay round trips. Applies on top of markdown-reply-images."

[[patch]]
name = "agent-steers-wait-for-tools"
file = "patches/0008-agent-steers-wait-for-tools.patch"
note = "An agent's send_message to a busy chat no longer stops the command that chat is running (the agent there read the stop as its call declined, and waited for nobody): it lands at the next step. mode 'steer' and the person's own steers are still read at once, and a steer that stops a command now tells the agent it was stopped, not declined. v3 only: it conflicts with main's plugin_agents.rs."

[[patch]]
name = "child-chats-report-back"
file = "patches/0007-child-chats-report-back.patch"
note = "Subagents and side chats report back to the chat that made them when their turn ends, a few seconds apart at most, never waiting on a stuck sibling. Kept in the chats themselves, so restarts and other devices lose none. A steer's stop is no stop, and a stop's report never takes the place of the end's. Goes after agent-steers-wait-for-tools, which its tests need."

[[patch]]
name = "child-reports-follow-ups"
file = "patches/0009-child-reports-follow-ups.patch"
note = "What real use of child-chats-report-back found: a turn a child starts on its own (its tests done, a timer) reports as a follow-up; a reply repeating what the child sent isn't said twice; a child's answer to a thanks doesn't wake its parent; the still-working note is short and right across devices; a report after the person's Stop still wakes the parent; after a handoff the new orchestrator gets the children, and nobody writes to an archived chat; a restart or another chat's Stop isn't the person's; a turn that ended on an error reports failed; Pi's info toasts stay out of replies, and Pi without a Zeron account still counts as connected. Applies on top of child-chats-report-back."

[[patch]]
name = "child-reports-held-stop"
file = "patches/0010-child-reports-held-stop.patch"
note = "The person's Stop on a child is held for two minutes: what they write to it meanwhile corrects the parent's task, so the parent hears nothing until the child's normal finished report, and the child stays on its wait. A Stop left standing reports once the hold is out; an agent's Stop or a Zeron restart still reports at once. Once the person writes to a child otherwise, it is theirs and its ends no longer report. Applies on top of child-reports-follow-ups."

[[patch]]
name = "reply-long-page-picture"
file = "patches/0011-reply-long-page-picture.patch"
note = "A long page in a reply (a phone screenshot, taller than 2:1) shows its top across its frame at its own shape, not blown up with its middle cropped: its `ui.image` took its pixels' own height as a flex item, and `cover` filled that. Not yet a PR upstream."

# The Design plugin's plugin-API PRs (pure-Luau Design plugin, developed
# against this nightly until upstream merges them). Move a `sha` when its PR
# gets new commits; delete the entry once the release notes say it's in.

[[patch]]
name = "plugin-tool-images"
pr = 1362
sha = "9d353580b41ac3fc0becf856eb6d87a58675399e"
note = "A plugin tool's answer can show the agent images: a top-level `imageContent` array goes out as MCP image content."

[[patch]]
name = "plugin-memory-limit"
pr = 1363
sha = "306d0b76c39f2eb61383e42bf13fab91f92576dd"
note = "A plugin service can ask for more than 64 MB of Luau memory in its manifest."

[[patch]]
name = "plugin-eval"
pr = 1366
sha = "bef96321848bb1023f24ba736d8287165b6da8eb"
note = "A plugin service can run scripts its agents write (`zeron.eval`), behind an \"eval\" permission."

[[patch]]
name = "service-measure-text"
pr = 1367
sha = "d034b682484a31713e773844cae5ca7ca1354280"
note = "A plugin service measures text (`zeron.measure_text`, `zeron.load_font`) with zgx's own shaper, as its window's canvas does; the engine depends on zgx at the app's rev."

[[patch]]
name = "zgx-nightly-design"
file = "patches/0012-zgx-nightly-design.patch"
note = "zgx from hoangvu12/zgx's nightly-design branch (b1853da3): zeron/zgx's pinned zgx 06c6d56 with zgx #2074 (ui.load_font), #2080 (ui.render_canvas, with its app-fonts fix and, on top of #2076, paragraphs wrapped at their width), #2076 (canvas text spacing and wrapping), #2081 (c:image) and #2082 (c:shadow) cherry-picked onto it. Every zgx line of apps/zgx/Cargo.toml and crates/engine/Cargo.toml and both lockfiles move. Goes after service-measure-text, which gives the engine its zgx lines."
# Another zgx PR: cherry-pick it onto nightly-design (a new commit, never a
# force-push), run its tests, push. Then in a checkout assembled up to here,
# replace the old rev with the new one in those two Cargo.toml files and both
# Cargo.lock files, check `cargo metadata --locked` in the root and in
# apps/zgx, commit, and regenerate this file with
# `git format-patch --full-index`. When zeron/zgx moves its zgx pin, rebuild
# the branch from the new pin (a new branch, e.g. nightly-design-<rev>) and
# do the same. Once a PR is in zeron/zgx's pin, drop its commit there too;
# once all are, delete this entry.
