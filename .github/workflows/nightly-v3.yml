name: nightly-v3

# Zeron v3 (the zgx interface, apps/zgx): upstream's main +
# patches-v3.toml, assembled from scratch (scripts/assemble.py), built for
# Windows (scripts/package-v3-windows.ps1) and Linux x86_64 and aarch64
# (upstream's scripts/package-linux.sh) and published as a prerelease that
# is never the latest. v2 installs follow releases/latest, so they never see
# these. v3 installs update from the `v3-latest` release instead: each run
# replaces its installer and manifest.json, and the app runs that installer
# silently over itself (patches/0005). Each release also carries the Linux
# engine its Docker sandboxes install (patches/0024).

on:
  schedule:
    - cron: "30 19 * * *" # 02:30 in Vietnam
  workflow_dispatch:
    inputs:
      force:
        description: Build even if upstream and the patch list are unchanged
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nightly-v3
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/zeronsh/zeron.git
  # v3 releases are the ones whose tag has this prerelease (v0.3.8-v3.N).
  # (A bracket, not a backslash: it goes into jq string literals.)
  TAG_MATCH: '-v3[.]'
  # The fixed release v3 installs update from.
  FEED_TAG: v3-latest

jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PUSH_TOKEN: ${{ secrets.NIGHTLY_PUSH_TOKEN }}
    outputs:
      version: ${{ steps.assemble.outputs.version }}
      head: ${{ steps.assemble.outputs.head }}
      build: ${{ steps.changed.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: tools
      - name: clone upstream
        run: git clone --quiet --filter=blob:none "$UPSTREAM" src
      - name: assemble
        id: assemble
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/scripts/assemble.py --src src --config tools/patches-v3.toml --report report.md
      - name: skip when nothing changed
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          FINGERPRINT: ${{ steps.assemble.outputs.fingerprint }}
          FORCE: ${{ inputs.force }}
        run: |
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
            --jq "[.[] | select(.tagName | test(\"$TAG_MATCH\"))] | sort_by(.createdAt) | last | .tagName // empty")
          last=""
          if [ -n "$tag" ]; then
            last=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body --jq .body \
              | sed -n 's/.*<!-- fingerprint: \([0-9a-f]*\) -->.*/\1/p')
          fi
          if [ "$FORCE" = "true" ] || [ "$last" != "$FINGERPRINT" ]; then
            echo build=true >> "$GITHUB_OUTPUT"
          else
            echo "Upstream and patches unchanged since the last v3 nightly ($last); skipping."
            echo build=false >> "$GITHUB_OUTPUT"
          fi
      - name: bundle the nightly commits
        if: steps.changed.outputs.build == 'true'
        run: git -C src bundle create ../nightly.bundle nightly ^refs/nightly/upstream
      - uses: actions/upload-artifact@v7
        if: steps.changed.outputs.build == 'true'
        with:
          name: source
          path: |
            nightly.bundle
            report.md
          if-no-files-found: error
      # Its own branch: `nightly` is the v2 nightly's.
      - name: push the nightly-v3 branch
        if: steps.changed.outputs.build == 'true' && env.PUSH_TOKEN != ''
        run: git -C src push --force "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" nightly:refs/heads/nightly-v3

  windows:
    needs: assemble
    if: needs.assemble.outputs.build == 'true'
    runs-on: windows-2022
    timeout-minutes: 240
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          path: tools
      - uses: actions/download-artifact@v8
        with:
          name: source
          path: source
      - name: check out the assembled nightly
        run: |
          git clone --quiet --filter=blob:none $env:UPSTREAM src
          git -C src fetch --quiet ../source/nightly.bundle nightly:nightly
          git -C src checkout --quiet nightly
          if ((git -C src rev-parse HEAD) -ne '${{ needs.assemble.outputs.head }}') { throw 'bundle does not match the assembled head' }
      - name: rust toolchain (rust-toolchain.toml)
        working-directory: src
        run: rustup show active-toolchain || rustup toolchain install
      # The engine's crate links the GPUI interface's library, which compiles
      # its shaders.
      - name: locate Windows SDK shader compiler
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/fxc.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { throw 'Windows SDK fxc.exe is required for GPUI release shaders' }
          "GPUI_FXC_PATH=$($fxc.FullName)" >> $env:GITHUB_ENV
      - uses: Swatinem/rust-cache@v2
        with:
          key: v3
          workspaces: |
            src -> target
            src/apps/zgx -> target
      - name: updater tests
        working-directory: src
        run: cargo test --locked -p zeron-update
      # Its sandboxes install the Linux engine of this same release (the
      # `linux` job's; patches/0024).
      - name: package installer and portable zip
        run: ./tools/scripts/package-v3-windows.ps1 -Src src -ReleasesUrl "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:FEED_TAG" -SandboxEngineReleases "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v${{ needs.assemble.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            src/target/package-v3/*.exe
            src/target/package-v3/*.zip
            src/target/package-v3/manifest.json
          if-no-files-found: error

  # Zeron v3 for Linux, as upstream's zgx-build.yml makes it: the zgx app as
  # `zeron` (headless servers run `zeron headless`), its scripts, and the
  # engine from the same tree, in upstream's tarball layout
  # (scripts/package-linux.sh). Docker sandboxes install its zeron-engine
  # (patches/0019's `watchdog`; the edge's engines are upstream's and lack
  # it): every build's engine names this release as where they are
  # (ZERON_SANDBOX_ENGINE_RELEASES, patches/0024). A Linux install updates
  # from the v3-latest feed with ZERON_RELEASES_URL set to it.
  linux:
    needs: assemble
    if: needs.assemble.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04 # x86_64: Docker sandboxes
          - runner: ubuntu-24.04-arm # aarch64: servers
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    env:
      VERSION: ${{ needs.assemble.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: tools
      - uses: actions/download-artifact@v8
        with:
          name: source
          path: source
      - name: check out the assembled nightly
        run: |
          git clone --quiet --filter=blob:none "$UPSTREAM" src
          git -C src fetch --quiet ../source/nightly.bundle nightly:nightly
          git -C src checkout --quiet nightly
          test "$(git -C src rev-parse HEAD)" = '${{ needs.assemble.outputs.head }}'
      - name: system deps (upstream's Linux release job's)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype-dev libasound2-dev \
            libvulkan-dev pkg-config cmake libwebkit2gtk-4.1-dev libjson-glib-dev \
            rsync
      - name: rust toolchain (rust-toolchain.toml)
        working-directory: src
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: v3-linux
          workspaces: |
            src -> target
            src/apps/zgx -> target
      - name: the engine
        working-directory: src
        env:
          ZERON_SANDBOX_ENGINE_RELEASES: https://github.com/${{ github.repository }}/releases/download/v${{ needs.assemble.outputs.version }}
          # Luau without its asserts, as upstream's: package-linux.sh refuses
          # an engine that has them.
          LUAU_CXXFLAGS: -DNDEBUG
        run: cargo build --release --locked -p zeron --bin zeron-engine
      - name: package
        working-directory: src
        run: ZGX_VERSION="$VERSION" ZGX_ENGINE="$PWD/target/release/zeron-engine" scripts/package-linux.sh
      - name: inspect and install the tarball
        working-directory: src
        run: |
          arch="$(uname -m)"
          tarball="target/package/zeron-$VERSION-linux-$arch.tar.gz"
          mkdir -p "$RUNNER_TEMP/unpacked" "$RUNNER_TEMP/home"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/unpacked"
          dir="$RUNNER_TEMP/unpacked/zeron-$VERSION-linux-$arch"
          test "$("$dir/zeron" --version)" = "zeron $VERSION"
          test "$("$dir/zeron-engine" --version)" = "zeron-engine $VERSION"
          # What a Docker sandbox runs, and only base libraries (a sandbox
          # has no desktop ones).
          "$dir/zeron-engine" watchdog --help >/dev/null
          readelf -d "$dir/zeron-engine" | grep NEEDED
          if readelf -d "$dir/zeron-engine" | grep NEEDED | grep -qvE 'lib(c|m|gcc_s|stdc\+\+|z)\.so|ld-linux'; then
            echo "zeron-engine needs a library a bare sandbox lacks"; exit 1
          fi
          grep -aq "releases/download/v$VERSION" "$dir/zeron-engine" ||
            { echo "zeron-engine doesn't name this release for its sandboxes"; exit 1; }
          test -f "$dir/ui/app.luau"
          test -d "$dir/plugins-builtin"
          HOME="$RUNNER_TEMP/home" "$dir/install.sh"
          test "$("$RUNNER_TEMP/home/.zeron/app/current/zeron" --version)" = "zeron $VERSION"
          du -sh "$dir" "$tarball"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ runner.arch }}
          path: src/target/package/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [assemble, windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.assemble.outputs.version }}
      PUSH_TOKEN: ${{ secrets.NIGHTLY_PUSH_TOKEN }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # One manifest for both: the Windows job's names its installer; each
      # Linux tarball joins it with its checksum (crates/update Manifest),
      # which a Linux install's updater checks.
      - name: the Linux tarballs join the manifest
        run: |
          for arch in x86_64 aarch64; do
            test -f "dist/zeron-$VERSION-linux-$arch.tar.gz" || { echo "no Linux $arch tarball"; exit 1; }
          done
          for f in dist/zeron-"$VERSION"-linux-*.tar.gz; do
            jq --arg name "$(basename "$f")" --arg sha "$(sha256sum "$f" | cut -d' ' -f1)" \
              '.files[$name] = {sha256: $sha}' dist/manifest.json > dist/manifest.next
            mv dist/manifest.next dist/manifest.json
          done
          test "$(jq -r .version dist/manifest.json)" = "$VERSION"
          jq . dist/manifest.json
      - name: release
        run: |
          target="$GITHUB_SHA"
          if [ -n "$PUSH_TOKEN" ]; then target="${{ needs.assemble.outputs.head }}"; fi
          # Never the latest: v2 installs update from releases/latest.
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$target" \
            --title "Zeron v3 $VERSION" --notes-file dist/report.md --prerelease --latest=false \
            dist/*.exe dist/*.zip dist/*.tar.gz dist/manifest.json dist/nightly.bundle
      # The feed: the new packages first (the Windows installer, the Linux
      # tarballs), then the manifest that names them, then the packages it
      # no longer names.
      - name: update the v3-latest feed
        run: |
          if ! gh release view "$FEED_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$FEED_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Zeron v3 update feed" --prerelease --latest=false \
              --notes "What installed Zeron v3 nightlies update from. Download a dated v3 release instead."
          fi
          setup="zeron-$VERSION-windows-x86_64-setup.exe"
          linux_x86="zeron-$VERSION-linux-x86_64.tar.gz"
          linux_arm="zeron-$VERSION-linux-aarch64.tar.gz"
          gh release upload "$FEED_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "dist/$setup" "dist/$linux_x86" "dist/$linux_arm"
          gh release upload "$FEED_TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/manifest.json
          gh release view "$FEED_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
          while read -r name; do
            case "$name" in
              manifest.json|"$setup"|"$linux_x86"|"$linux_arm") ;;
              *) gh release delete-asset "$FEED_TAG" "$name" --repo "$GITHUB_REPOSITORY" --yes ;;
            esac
          done
      - name: keep the last 14 v3 nightlies
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
            --jq "[.[] | select(.tagName | test(\"$TAG_MATCH\"))] | sort_by(.createdAt) | reverse | .[14:] | .[].tagName" |
          while read -r tag; do
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done
