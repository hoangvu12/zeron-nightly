[package]
name = "zeron-design"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Zeron Design: the Design model, its edits and its renderer (Skia on the CPU), shared by Zeron's engine and its zgx app"

[features]
# The snippet sandbox agents edit Designs through (QuickJS), for the
# engine; the zgx app only draws.
snippet = ["dep:rquickjs"]
# Fetching Google Fonts (fonts::GoogleFonts) over HTTPS.
google-fonts = ["dep:ureq"]

[dependencies]
# Pinned with `gl` to the feature set of a published prebuilt
# (apps/zgx/docs/design/adr/0002): the build downloads Skia instead of
# compiling it, so it needs no clang, Python or ninja. Only the raster
# backend draws; GL is linked but unused.
skia-safe = { version = "=0.157.0", features = ["gl", "textlayout", "svg"] }
serde.workspace = true
serde_json.workspace = true
# Image downloads' cache file names (images.rs).
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
# QuickJS-ng compiled by `cc` against bindings rquickjs-sys ships for
# x86_64-pc-windows-msvc (no bindgen, so no clang or LLVM).
rquickjs = { version = "0.14", optional = true }
# Blocking, so a font fetches from inside the layout pass; native TLS
# (Windows' own), as the rest of the workspace's ureq 3 builds it.
ureq = { version = "3", default-features = false, features = ["native-tls"], optional = true }
